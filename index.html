<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business blog card</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link
      rel="icon"
      href="favicon.ico"
      type="image/x-icon"
      sizes="96x96"
    />
</head>
<body>
    <div class="wrap">
        <div class="hero-sec">
            <img class="hero-image" src="hero-image.jpg" alt="The hero image">
            <img class="overlay-img" src="white-overlay.svg" alt="The white overlay">
        </div>

        <div class="texts">
            <h2>Perfect solution for small <br>
             business</h2>
            <p>Small businesses need to generate leads to grow. You can use tools like Ringy.</p>
        </div>

        <div class="outro">
            <img src="avatar-image-business-card.png" alt="The avatar image">
            <div class="texts-wrap">
                <h3>Amy Burgess</h3>
                <p>Customer Manger, Solution Oy</p>
            </div>
        </div>
    </div>
</body>
</html>
